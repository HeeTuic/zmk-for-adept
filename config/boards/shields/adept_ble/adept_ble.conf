# Adept BLE shield：功能开关
# SPDX-License-Identifier: MIT
#
# 这里只放“和键盘功能相关”的开关；蓝牙链路、按键去抖、Studio 等
# 仓库级设置在上两级目录的 config/adept_ble.conf 里。

# --- 轨迹球 ----------------------------------------------------------------
# SPI：与 PMW3610 通信的总线
CONFIG_SPI=y
# INPUT：Zephyr 输入子系统，驱动上报坐标走它
CONFIG_INPUT=y
# ZMK 的指针支持（含 input-listener，把 input 事件接到 HID）
CONFIG_ZMK_POINTING=y

# 启用 PMW3610 驱动（compatible 为 pixart,pmw3610-alt 的那个模块）
CONFIG_PMW3610_ALT=y

# 上电延时：给传感器供电的 1.9V 那一路 LDO 升压比驱动预期慢，
# 不加延时时 probe 阶段会读到错误的产品 ID（日志报
# "Incorrect product id 0xFF (expecting 0x3E)"），表现为轨迹球完全不工作。
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
