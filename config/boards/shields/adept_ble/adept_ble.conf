# Adept BLE shield
# SPDX-License-Identifier: MIT

CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y

CONFIG_PMW3610_ALT=y

# The 1.9 V rail feeding the sensor ramps up slower than the driver expects,
# which otherwise shows up as "Incorrect product id 0xFF" during probe.
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000
