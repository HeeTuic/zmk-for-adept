# Adept BLE shield：轨迹球相关开关
# SPDX-License-Identifier: MIT
#
# 本文件只管轨迹球驱动本身。按键去抖、蓝牙链路、电源、Studio 等
# 仓库级设置在同仓库的 config/adept_ble.conf 里。

# --- 总线与子系统 ----------------------------------------------------------
# SPI：与 PMW3610 通信的总线
CONFIG_SPI=y
# INPUT：Zephyr 输入子系统，驱动上报坐标走它
CONFIG_INPUT=y
# ZMK 的指针支持（含 input-listener，把 input 事件接到 HID）
CONFIG_ZMK_POINTING=y

# --- 驱动 ----------------------------------------------------------------
# compatible 为 pixart,pmw3610-alt 的驱动模块
CONFIG_PMW3610_ALT=y

# 智能算法：按曝光时间（shutter）自动增强表面跟踪能力。
# 驱动里默认就是 y，这里显式写出来，方便以后对照调参。
CONFIG_PMW3610_ALT_SMART_ALGORITHM=y

# 上电延时：给传感器供电的 1.9V 那一路 LDO 升压比驱动预期慢，
# 不加延时时 probe 阶段会读到错误的产品 ID（日志报
# "Incorrect product id 0xFF (expecting 0x3E)"），表现为轨迹球完全不工作。
CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=1000

# --- 上报节流（解决「移动轨迹球时电脑卡顿」的关键）---------------------------
#
# 传感器在 RUN 模式下每 8ms 采样一次，即理论上限 125 次/秒。
# 不节流时驱动每采到一次就发一个 HID 报告，于是：
#   1) 每秒最多 125 个 BLE 通知，而连接间隔是 7.5~10ms（每秒 100~133 个事件），
#      等于把链路占满，没有余量应对抖动；
#   2) BLE 栈每秒处理上百次 notify，CPU 占用升高，连接维护被挤占；
#   3) 发送跟不上时 zmk_hog 的鼠标报告队列（20 条）会满，旧报告被丢弃，
#      表现就是指针一顿一顿、整机像卡住。
#
# 设成 15ms 后每秒最多 66 个报告，稳定落在「每个连接事件一个报告」以内，
# 链路有余量、队列不再堆积。
#
# 位移不会丢：驱动把两次上报之间的位移累加（dx/dy 是 int64_t，不会溢出），
# 到点一次性发出，所以是「合并」而不是「丢帧」。光标移动的总距离不变，
# 只是上报频率降低，轨迹更平滑。
#
# 可调范围参考：
#   8  仅 USB 连接时用，最快
#   15 BLE 下的推荐值（本配置）
#   20 更省电，但指针会略显顿挫
CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=15
