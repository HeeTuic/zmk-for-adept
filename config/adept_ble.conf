# Adept BLE
# SPDX-License-Identifier: MIT

CONFIG_ZMK_KEYBOARD_NAME="Adept BLE"

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# VBAT is read through the 820K / 2M divider on E73 pad 18 (P0.04 / AIN2).
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Debug output goes to the USB CDC ACM console provided by the
# zmk-usb-logging snippet (see build.yaml).  It supplies the cdc-acm-uart
# devicetree node, so CONFIG_ZMK_USB_LOGGING must not be set here.
CONFIG_LOG_MODE_IMMEDIATE=y

# Extra logging while bringing up the hardware.  The PMW3610 driver registers
# its log module against CONFIG_INPUT_LOG_LEVEL.
CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_PMW3610_LOG_LEVEL_DBG=y
