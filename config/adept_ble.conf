# Adept BLE
# SPDX-License-Identifier: MIT

CONFIG_ZMK_KEYBOARD_NAME="Adept BLE"

# --- Bluetooth link --------------------------------------------------------
# Short connection interval for low input latency, two skipped events for
# power, and a short supervision timeout that still tolerates a few lost
# packets.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=8
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# Maximum transmit power for a solid link at range.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# The nRF52840 controller supports the 2M PHY.  Requesting it shortens the air
# time of every report, which matters most for trackball motion.
CONFIG_BT_USER_PHY_UPDATE=y

# Queue depth: enough headroom for trackball bursts without wasting RAM.
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_BUF_ACL_RX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=24

# --- power / battery -------------------------------------------------------
# VBAT is read through the 820K / 2M divider on E73 pad 18 (P0.04 / AIN2).
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# --- keys ------------------------------------------------------------------
# These switches bounce for longer than the 5 ms devicetree default, which
# makes a single press register as nothing or as several events.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=15
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15

# --- pointing --------------------------------------------------------------
# The input subsystem runs its callbacks in a dedicated thread whose stack
# defaults to 512 bytes, which is too small while the trackball reports at
# speed.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# --- logging ---------------------------------------------------------------
# Kept deliberately minimal.  The logging mode is left at its default
# (deferred), so log writes never run synchronously inside the trackball
# interrupt; info-level output is enough to see bring-up and errors, and the
# verbose per-module debug levels are off.
