# Adept BLE：仓库级配置
# SPDX-License-Identifier: MIT
#
# 本文件是「整把键盘」的开关集合。轨迹球驱动相关的开关在同仓库的
# config/boards/shields/adept_ble/adept_ble.conf 里。

CONFIG_ZMK_KEYBOARD_NAME="Adept BLE"

# ===========================================================================
# 一、蓝牙链路（延迟 / 稳定性 / 吞吐）
# ===========================================================================
#
# 连接间隔：单位 1.25ms。区间越小响应越快、耗电略高。
#   MIN=6 -> 7.5ms，MAX=8 -> 10ms
# 这个区间是「每个连接事件都能装下一帧数据」的前提。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=8

# 从机延迟：允许从机跳过几个连接事件。这是指针类设备的关键参数：
#   =2（原值）最坏情况要等 3 个连接事件，约 30ms 才发出一个报告，
#             指针会有明显的「拖尾」感；
#   =0（现值）每个连接事件都上报，最坏延迟 = 一个连接间隔（约 10ms）。
# 指针设备优先保证低延迟，所以设为 0。
# 功耗代价很小：ZMK 在空闲 15 分钟后会整机深度睡眠（见下文），
# 真正长时间保持连接的窗口很短。
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0

# 监督超时：单位 10ms，400 -> 4s。超过这个时间收不到对方就判定断连。
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# ZMK 官方标注为「未来版本会默认启用」的连接稳定性改进。
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# 注意：上面这一项内部会隐含 BT_CTLR_PHY_2M=n（见 ZMK 的 app/Kconfig），
# 也就是关闭 2M PHY。所以这里不写 CONFIG_BT_USER_PHY_UPDATE=y —— 写了也不
# 起作用，只会让人误以为在用 2M PHY。
# 若将来想要 2M PHY（吞吐更高，但对部分 Windows 无线网卡兼容性差），
# 做法是删掉 CONFIG_ZMK_BLE_EXPERIMENTAL_CONN，并加上：
#   CONFIG_BT_CTLR_PHY_2M=y
#   CONFIG_BT_USER_PHY_UPDATE=y
# 当前选择以稳定性优先，吞吐问题由驱动侧的上报节流解决。

# 发射功率拉到最大，换取更稳的连接与更远的可用距离。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ===========================================================================
# 二、电源与电量
# ===========================================================================
#
# 电量上报。分压电阻与引脚见 boards/arm/adept_ble/adept_ble.dts。
CONFIG_ZMK_BATTERY_REPORTING=y
# 读数方式必须是「锂电压换算」。
# ZMK 的默认取法是 STATE_OF_CHARGE，即向电量计芯片（如 MAX17048）要百分比；
# 本板没有电量计芯片，只有 820K/2M 分压电阻，用默认取法会一直读失败、
# 电量恒为 0。指定锂电压后由 ZMK 内置的 lithium_ion_mv_to_pct() 把
# 分压换算出的电压拟合成百分比。
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y

# 深度睡眠支持。
CONFIG_ZMK_SLEEP=y
# 空闲 60 秒进入 IDLE：此时驱动会关掉传感器的强制唤醒（force-awake），
# 传感器从 RUN 降频到 REST，省下约 1.5mA。
CONFIG_ZMK_IDLE_TIMEOUT=60000
# 空闲 15 分钟进入深度睡眠：射频关闭，整机降到微安级。
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ===========================================================================
# 三、状态指示灯
# ===========================================================================
# 本板 blue_led（P1.10）不接任何指示逻辑，保持常灭。
# 曾试过 zmk-poor-mans-led-indicator 模块，但它会在开机闪完电量后把灯留在
# 常亮状态（约 1.5mA，明显吃电量），原因在其线程收尾逻辑，已整体移除。
# 电量由 ZMK 的 BLE 电池服务上报，主机系统或 ZMK Studio 都能看到。

# ===========================================================================
# 四、按键
# ===========================================================================
# 去抖时间。Zephyr 默认 5ms，这些微动开关抖动更久，
# 不加大去抖会出现「按一下没反应」或「按一下出好几个字符」。
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=15
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15

# ===========================================================================
# 五、轨迹球输入线程
# ===========================================================================
# 输入子系统的回调跑在独立线程里，线程栈默认只有 512 字节，
# 轨迹球高速上报时会溢出并导致整机重启（表现为蓝牙断连、要断电才能恢复）。
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# ===========================================================================
# 六、ZMK Studio（在线改键）
# ===========================================================================
# 两种连接方式都开：
#   UART  走 USB CDC ACM 串口（串口设备由 studio-rpc-usb-uart snippet 提供，见 build.yaml）
#   BLE   走蓝牙 GATT 服务，Studio 桌面端与手机端用这个
# 只开 UART 的话，走蓝牙的 Studio 客户端会报
# "Failed to find the studio service characteristics"。
# 开锁定：必须先按解锁键（配置层「右上大键」）才允许改键。
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_TRANSPORT_UART=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
