# Adept BLE
# SPDX-License-Identifier: MIT

CONFIG_ZMK_KEYBOARD_NAME="Adept BLE"

CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=32
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# VBAT is read through the 820K / 2M divider on E73 pad 18 (P0.04 / AIN2).
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=60000
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# These switches bounce for longer than the 5 ms devicetree default, which
# makes a single press register as nothing or as several events.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=15
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15

# --- pointing --------------------------------------------------------------
# The input subsystem processes events in its own thread, whose stack defaults
# to 512 bytes.  That is not enough to run the HID callbacks while the
# trackball is reporting at speed, and the overflow resets the whole device.
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# Catch any remaining stack overflow deterministically instead of letting it
# corrupt memory silently, and report peak usage in the log.
CONFIG_HW_STACK_PROTECTION=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=60

# --- temporary bring-up logging -------------------------------------------
# Output goes to the USB CDC ACM console supplied by the zmk-usb-logging
# snippet (see build.yaml), so CONFIG_ZMK_USB_LOGGING must not be set here.
# Remove this block once the hardware is confirmed working.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_PMW3610_ALT_LOG_LEVEL_DBG=y
