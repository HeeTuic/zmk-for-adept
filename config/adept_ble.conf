# Adept BLE：仓库级配置
# SPDX-License-Identifier: MIT
#
# 本文件是“整把键盘”的开关集合，上电后按这里配置运行。
# 与它并列的 config/boards/shields/adept_ble/adept_ble.conf 只管轨迹球驱动。

CONFIG_ZMK_KEYBOARD_NAME="Adept BLE"

# --- 蓝牙链路 --------------------------------------------------------------
# 连接间隔：数字单位是 1.25ms。区间设小 -> 响应快、耗电略高。
#   MIN=6 -> 7.5ms，MAX=8 -> 10ms
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=8
# 从机延迟：允许跳过 2 个连接事件不回应，省电但会增加一点延迟。
CONFIG_BT_PERIPHERAL_PREF_LATENCY=2
# 监督超时：单位 10ms，400 -> 4s。超过这个时间收不到对方就判定断连。
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400

# 发射功率拉到最大，换取更稳的连接与更远的可用距离。
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 请求 2M PHY（nRF52840 支持）。空中传输时间减半，
# 对需要频繁上报的轨迹球提升最明显。
CONFIG_BT_USER_PHY_UPDATE=y

# 缓冲区深度：够应对轨迹球突发上报，又不浪费 RAM。
CONFIG_BT_BUF_ACL_TX_COUNT=24
CONFIG_BT_BUF_ACL_RX_COUNT=10
CONFIG_BT_BUF_EVT_RX_COUNT=10
CONFIG_BT_L2CAP_TX_BUF_COUNT=24

# --- 电源与电量 ------------------------------------------------------------
# 电量上报。分压电阻与引脚在 boards/arm/adept_ble/adept_ble.dts 里定义。
CONFIG_ZMK_BATTERY_REPORTING=y
# 读数方式必须是「锂电压换算」。
# ZMK 的默认取法是 STATE_OF_CHARGE，即向电量计芯片（如 MAX17048）要百分比；
# 本板没有电量计芯片，只有 820K/2M 分压电阻，用默认取法会一直读失败、
# 电量恒为 0。指定锂电压后由 ZMK 内置的 lithium_ion_mv_to_pct() 把
# 分压换算出的电压拟合成百分比。
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_LITHIUM_VOLTAGE=y
# 允许进入深度睡眠。
CONFIG_ZMK_SLEEP=y
# 空闲 15 分钟进睡眠；空闲 1 分钟关掉射频以省电。
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
CONFIG_ZMK_IDLE_TIMEOUT=60000
# 使用 ZMK 改进过的连接参数协商逻辑。
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# --- LED 状态指示 ----------------------------------------------------------
# 用板上一颗蓝灯（blue_led，P1.10）闪出状态。
# 灯节点与 indicator-led 别名在 boards/arm/adept_ble/adept_ble.dts 里定义；
# 模块本体来自 west.yml 中的 zmk-poor-mans-led-indicator。
#
# 只保留「开机闪电量」一项，其余指示全部关闭。原因见下面各项注释：
# 模块里有四种会点亮灯的事件，每种都会往队列里放一段闪烁序列。
CONFIG_INDICATOR_LED_WIDGET=y

# 开机闪电量：保留。
# 高电量闪 2 下、低电量闪 4 下、极低电量闪 6 下，闪完灯自动熄灭。
CONFIG_INDICATOR_LED_SHOW_BATTERY_ON_BOOT=y

# 蓝牙状态指示：关闭。
# 这是之前「开完机一直长亮」的来源：已连接时模块用的是「亮 1000ms / 灭 100ms」
# 的序列，而且闪的次数 = 当前蓝牙槽位号 + 1，槽位靠后时会连续亮好几秒，
# 看起来就是一直亮着。蓝灯约 1.5mA，一直亮会明显吃电量。
# 蓝牙连接状态用 ZMK Studio 或主机系统查看即可，不需要靠灯。
CONFIG_INDICATOR_LED_SHOW_BLE=n
CONFIG_INDICATOR_LED_SHOW_PERIPHERAL_BLE=n

# 切层提示：关闭。本键盘只有 3 层且层切换是按住式的，闪灯会过于频繁。
CONFIG_INDICATOR_LED_SHOW_LAYER_CHANGE=n

# 低电量变化提示：关闭，避免正常使用时突然闪灯。
# 注意符号名：模块 Kconfig 里作者多写了一个 CONFIG_ 前缀，
# 实际符号是 CONFIG_INDICATOR_LED_SHOW_CRITICAL_BATTERY_CHANGES，
# 所以在 .conf 里要写成双前缀。
CONFIG_CONFIG_INDICATOR_LED_SHOW_CRITICAL_BATTERY_CHANGES=n

# --- 按键 ------------------------------------------------------------------
# 去抖时间。Zephyr 默认 5ms，这些微动开关抖动更久，
# 不加大去抖会出现“按一下没反应”或“按一下出好几个字符”。
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=15
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=15

# --- 轨迹球 ----------------------------------------------------------------
# 输入子系统的回调跑在独立线程里，线程栈默认只有 512 字节，
# 轨迹球高速上报时会溢出并导致整机重启（表现为蓝牙断连、要断电才能恢复）。
CONFIG_INPUT_THREAD_STACK_SIZE=2048

# --- ZMK Studio ------------------------------------------------------------
# 两种连接方式都开：
#   UART  走 USB CDC ACM 串口（串口设备由 studio-rpc-usb-uart snippet 提供，见 build.yaml）
#   BLE   走蓝牙 GATT 服务，Studio 桌面端与手机端用这个
# 只开 UART 的话，走蓝牙的 Studio 客户端会报
# "Failed to find the studio service characteristics"。
# 开启锁定：必须先按解锁键（键位表第 3 层的 K3）才允许改键。
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=y
CONFIG_ZMK_STUDIO_TRANSPORT_UART=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y
