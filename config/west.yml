# west 清单：声明本固件依赖哪些外部源码
# SPDX-License-Identifier: MIT
#
# GitHub Actions 构建时会按这份清单拉取源码。改版本号就在这里改。

manifest:
  remotes:
    # ZMK 官方仓库
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    # 轨迹球驱动作者
    - name: badjeff
      url-base: https://github.com/badjeff
    # LED 状态指示模块作者
    - name: bluedrink9
      url-base: https://github.com/BlueDrink9

  projects:
    # ZMK 本体。revision 用 tag 可以锁定版本、保证每次编译结果一致。
    - name: zmk
      remote: zmkfirmware
      revision: v0.3.0
      import: app/west.yml

    # PMW3610 轨迹球驱动模块。
    # compatible 为 "pixart,pmw3610-alt"，Kconfig 前缀 CONFIG_PMW3610_ALT_*。
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: main

    # 单色 LED 状态指示模块。
    # 用板上一颗普通 GPIO 灯（本板的 blue_led）闪出电量、蓝牙状态与当前层。
    # 要求设备树里有 aliases 条目 indicator-led（见 board 的 adept_ble.dts）。
    - name: zmk-poor-mans-led-indicator
      remote: bluedrink9
      revision: main

  self:
    # 本仓库自身（config 目录下放 west.yml，是 ZMK config 仓库的标准布局）
    path: config
