# 本文件生成 GitHub Actions 的构建矩阵（每一项产出一个 .uf2）。
#
# studio-rpc-usb-uart snippet 提供 ZMK Studio 走 USB 时用的 CDC ACM 串口，
# 会额外启用所有行为（ZMK_BEHAVIORS_KEEP_ALL），这样 Studio 里能改到全部行为。
---
include:
  # 正常固件：平时用这个
  - board: adept_ble
    shield: adept_ble
    snippet: studio-rpc-usb-uart
    artifact-name: adept_ble

  # 出厂设置重置固件：清除闪存里保存的键位、蓝牙配对与各项设置。
  # 用途：ZMK Studio 改过的键位会覆盖编译进固件的键位（官方行为），
  #       想让新编译的键位生效，就得先刷这个重置固件清一次。
  # 刷完后重新刷回上面的正常固件即可。
  #
  # cmake-args 里追加 reset.conf，用来在这一次构建中关掉 ZMK Studio：
  # settings_reset shield 不带物理布局，而 Studio 要求必须有，否则编译断言失败。
  - board: adept_ble
    shield: settings_reset
    artifact-name: adept_ble-settings_reset
    cmake-args: -DEXTRA_CONF_FILE=reset.conf
