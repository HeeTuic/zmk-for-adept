# 本文件生成 GitHub Actions 的构建矩阵（每一项产出一个 .uf2）。
#
# studio-rpc-usb-uart snippet 提供 ZMK Studio 走 USB 时用的 CDC ACM 串口，
# 会额外启用所有行为（ZMK_BEHAVIORS_KEEP_ALL），这样 Studio 里能改到全部行为。
---
include:
  # 正常固件：唯一需要刷的固件
  - board: adept_ble
    shield: adept_ble
    snippet: studio-rpc-usb-uart
    artifact-name: adept_ble

# 关于「清除已保存的设置」：
#
# 之前这里还构建过一个 settings_reset 固件，那个做法是错的，已移除。
# 原因：
#   1) 官方 settings_reset shield 没有真实键位表、并把蓝牙整个关掉，
#      烧到本板上会陷在「每次开机擦设置 → 重启」的循环里，
#      双击复位抓不到时间窗，等于丢掉恢复手段。
#   2) 即使改成「正常 shield + CONFIG_ZMK_SETTINGS_RESET_ON_START=y」，
#      仍然是每次上电就擦一次，天生带有重启循环风险。
#
# 正确做法（不需要专门的固件）：
#   需要清设置时，用 ZMK Studio 的 "Restore Stock Settings" 功能即可，
#   它会清除保存的键位，清除后编译进固件的键位重新生效。
#   蓝牙配对信息则用配置层的 &bt BT_CLR 键清除。
