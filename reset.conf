# Adept BLE：出厂设置重置固件专用配置
# SPDX-License-Identifier: MIT
#
# 只在构建 settings_reset 固件时，通过 build.yaml 里那一项的
# cmake-args 追加进来（-DEXTRA_CONF_FILE=reset.conf）。
#
# 为什么必须关掉 ZMK Studio：
#   settings_reset 这个官方 shield 只提供按键扫描占位（zmk,kscan-mock）
#   与一张只含 &sys_reset 的键位表，它不提供物理布局。
#   而 ZMK 的 physical_layouts.c 里有这样一条编译期断言：
#     BUILD_ASSERT(!IS_ENABLED(CONFIG_ZMK_STUDIO) || USE_PHY_LAYOUTS, ...)
#   本工程主配置里开着 CONFIG_ZMK_STUDIO=y，若构建产物不带物理布局，
#   就会触发断言、直接编译失败。重置固件不需要改键，所以这里关掉即可。
CONFIG_ZMK_STUDIO=n
